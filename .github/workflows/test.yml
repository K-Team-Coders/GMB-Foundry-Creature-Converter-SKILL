name: test
on: [push, pull_request]
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: skills/gmb-foundry-creature-converter/examples
        run: |
          for f in *.spec.json; do python ../scripts/build_foundry.py "$f" -o "/tmp/$f.out.json"; done
          python ../scripts/validate_foundry.py /tmp/*.out.json --quiet
